const payOk=m.pay&&m.pay.ok,need=Math.max(0,c.min-$m.ready),can=m.st=='active'&&payOk&&$m.ready>=c.min&&$m.ready>0&&!D.payouts.some(p=>p.st=='requested');
const why=m.st!='active'?'Your account is paused, so payouts are paused too.':D.payouts.some(p=>p.st=='requested')?'Your payout request is waiting for us to pay it.':!m.pay?'Add your payout details in Profile first.':!payOk?'Waiting for the shop to confirm your payout details.':$m.ready<c.min?`You need ${rp(need)} more approved commission to reach the minimum payout of ${rp(c.min)}.`:'';
let h=`<h2 style="margin-top:16px">Hi ${esc(m.name.split(' ')[0])} 👋</h2>${sacTop()}${m.st=='paused'?'<div class="msg w">⏸ Your account is paused. New orders are not credited while it is paused. '+(c.email?'Questions? Email '+esc(c.email)+'.':'Please contact us.')+'</div>':''}${msg()}<div class="tabs">${T.map(t=>`<button class="${TAB==t[0]?'on':''}" onclick="TAB='${t[0]}';dash()">${t[1]}</button>`).join('')}</div>`;
if(TAB=='ov'){h+=`<div class="card"><div class="mut">Ready to withdraw</div><div class="big">${rp($m.ready)}</div><div class="mut">⏳ Under review ${rp($m.pending)} · 💸 In payout ${rp($m.inpay)} · 💰 Paid ${rp($m.paid)}</div>
<div class="pdn">📅 <b>Payout day: every ${esc(pd0.name)}</b><div>Minimum payout ${rp(c.min)}. ${pd0.today?'<b>Today is payout day!</b> Request your payout now and we pay it today.':'Next payout day: '+(pd0.inDays==1?'tomorrow':'in '+pd0.inDays+' days')+' ('+esc(pd0.name)+').'}</div></div>
<div style="margin-top:12px"><button class="${can?'blink':''}" style="width:100%;font-size:17px;padding:15px" ${can?'':'disabled'} onclick="askPayout()">💸 REQUEST PAYOUT</button>${why?`<div class="mut" style="margin-top:6px">${esc(why)}</div>`:''}</div></div>
<div class="card"><b>Your link</b><div class="copy"><input readonly value="${esc(link())}" onfocus="this.select()"><button class="s" onclick="cp('${esc(link())}')">Copy link</button></div><div class="row" style="margin-top:8px"><span><b>Your code:</b> <code>${esc(m.code)}</code>${(m.sac&&m.sac.disc||m.disc)>0?` <span class="mut">gives customers ${m.sac&&m.sac.disc||m.disc}% off</span>`:''}</span><button class="s" onclick="cp('${esc(m.code)}')">📋 Copy code</button></div>
<b style="display:block;margin-top:12px">📤 Share your code</b><div class="shr">${[['wa','💬 WhatsApp','#25d366'],['ig','📸 Instagram','linear-gradient(45deg,#f58529,#dd2a7b,#8134af)'],['th','🧵 Threads','#111'],['x','✖ X','#111'],['fb','📘 Facebook','#1877f2'],['tg','✈ Telegram','#229ed9']].map(a=>`<button class="shb" style="background:${a[2]}" onclick="shareTo('${a[0]}')">${a[1]}</button>`).join('')}${navigator.share?`<button class="shb" style="background:#6b7280" onclick="shareTo('native')">⤴ More…</button>`:''}<button class="shb" style="background:#92400e" onclick="cp(shareMsg())">📝 Copy message</button></div><div class="mut">Orders that come from your link (within ${c.days} days) or use your code are credited to you.</div><button class="s g" style="margin-top:8px" onclick="qr()">Show QR code</button><div id="qr" class="qr hide"></div></div>
<div class="tabs" style="margin:6px 0 0">${RANGES.map(r=>`<button class="${RK==r[0]?'on':''}" onclick="RK='${r[0]}';EXP.clear();reload()">${r[1]}</button>`).join('')}</div>${RK=='custom'?`<div style="display:flex;gap:6px;margin-top:6px"><input type="date" value="${RF}" onchange="RF=this.value;reload()"><input type="date" value="${RT}" onchange="RT=this.value;reload()"></div>`:''}
<div class="grid" style="margin-top:8px"><div class="kpi"><b>${S.clicks}</b><span>Link views</span></div><div class="kpi"><b>${S.uniq}</b><span>Unique visitors</span></div><div class="kpi"><b>${S.orders}</b><span>Orders</span></div><div class="kpi hi"><b>${S.paidOrders}</b><span>Paid orders (customer paid)</span></div><div class="kpi"><b>${S.coupon}</b><span>Orders with your code</span></div><div class="kpi"><b>${rp(S.sales)}</b><span>Product sales</span></div>
<div class="kpi hi" style="grid-column:span 2"><b>${rp(S.total)}</b><span>Total commission in this period</span></div><div class="kpi rv"><b>${rp(S.review)}</b><span>⏳ Under review (waiting delivery + ${c.hold} days)</span></div><div class="kpi wp"><b>${rp(S.inpay)}</b><span>💸 Waiting payout (requested)</span></div><div class="kpi"><b>${rp(S.ready)}</b><span>✅ Approved, not requested yet</span></div><div class="kpi"><b>${rp(S.paid)}</b><span>💰 Paid out</span></div></div>
<div class="card"><div class="row"><b>Commission per day</b><span class="mut">${rp(S.total)}</span></div>${chart(S.series)}<div class="row mut"><span>${S.series[0].d.slice(5)}</span><span>${S.series[S.series.length-1].d.slice(5)}</span></div></div>
${perf()}${srcCard(S.src)}${D.top.length?`<div class="card"><b>Your best-selling products</b>${D.top.map(t=>`<div class="row" style="margin-top:6px"><span>${esc(t.e)} ${esc(t.n)}</span><b>${t.q}×</b></div>`).join('')}</div>`:''}
${sacCard()}${howCard()}${contactDash()}`}
else if(TAB=='or'){h+=`<div class="card"><b>Your orders</b><div class="mut">Commission = ${m.rate}% of the product total the customer paid. Delivery, packaging, service and tax are not included. Showing the period chosen in Overview.</div>${D.orders.length?D.orders.map(o=>`<div class="ord"><div class="row"><span><b>#${esc(o.no)}</b> · ${esc(o.name)} · ${o.n} item${o.n==1?'':'s'}</span>${chip(o.st)}</div><div class="calc">${new Date(o.at).toLocaleDateString()} · ${o.via=='coupon'?'your code':'your link'} · ${rp(o.base)} × ${o.rate}% = <b>${rp(o.amt)}</b></div>${o.st=='void'?`<div class="calc" style="color:var(--bad)">${esc(o.why||'Cancelled')} – no commission</div>`:o.st=='pending'?`<div class="calc">Under review: confirmed ${c.hold} days after delivery, if there is no complaint</div>`:''}</div>`).join(''):'<p class="mut">No orders in this period. Share your link to get started!</p>'}</div>`}
else if(TAB=='po'){h+=`<div class="card"><div class="pdn" style="margin-top:0">📅 <b>Payout day: every ${esc(pd0.name)}</b><div>Minimum payout ${rp(c.min)}.</div></div><b style="display:block;margin-top:12px">Payouts</b>${D.payouts.length?D.payouts.map(p=>`<div class="ord"><div class="row"><span>${new Date(p.at).toLocaleDateString()} · ${p.n} order${p.n==1?'':'s'}</span><b>${rp(p.amt)}</b></div><div class="calc">${p.st=='paid'?'<span class="chip c-paid">💰 Paid '+new Date(p.paidAt).toLocaleDateString()+'</span>'+(p.ref?' ref '+esc(p.ref):''):p.st=='requested'?'<span class="chip c-inpay">⏳ Waiting for payment</span>':'<span class="chip c-void">Not paid</span> '+esc(p.note)}</div></div>`).join(''):'<p class="mut">No payouts yet.</p>'}</div>`}
else if(TAB=='pr'){const p=m.pay||{};h+=`<div class="card"><b>Your details</b><label>Name</label><input id="pn" value="${esc(m.name)}"><label>WhatsApp number</label><input id="pw" type="tel" value="${esc(m.wa)}"><button class="s" onclick="saveProfile()">Save</button></div>
<div class="card"><b>Payout details</b> ${m.pay?(p.ok?'<span class="chip c-approved">✅ Confirmed by the shop</span>':'<span class="chip c-pending">⏳ Waiting for the shop to confirm</span>'):''}<div class="mut">We pay to this account every ${esc(pd0.name)}. The shop checks your details before the first payout. If you change them, they need to be confirmed again.</div><label>Bank or e-wallet</label><select id="pt"><option value="bank" ${p.t!='ewallet'?'selected':''}>Bank transfer</option><option value="ewallet" ${p.t=='ewallet'?'selected':''}>E-wallet</option></select><label>Bank / e-wallet name (e.g. BCA, GoPay)</label><input id="pb" value="${esc(p.bank||'')}"><label>Account / phone number ${p.acc?'(saved: '+esc(p.acc)+')':''}</label><input id="pa" inputmode="numeric" placeholder="${p.acc?'Enter again to change':''}"><label>Account holder name</label><input id="pm" value="${esc(p.nm||'')}"><button class="s" onclick="savePay()">Save payout details</button></div>
<div class="card"><b>Change password</b><label>Current password</label><input id="p0" type="password" autocomplete="current-password"><label>New password (at least 10 characters)</label><input id="p1" type="password" autocomplete="new-password"><button class="s" onclick="savePw()">Change password</button></div>${contactDash()}`}
else h+=sacCard()+howCard(true)+contactDash();
$('#app').innerHTML=h;if($('#sacx'))sacUp()}
const contactDash=()=>D.cfg.email?`<div class="card">💬 <b>Questions about the affiliate programme?</b><br>Email us at <a href="mailto:${esc(D.cfg.email)}?subject=Affiliate%20question">${esc(D.cfg.email)}</a>. We are happy to help.</div>`:'';
const chip=s=>({pending:'<span class="chip c-pending">⏳ Under review</span>',approved:'<span class="chip c-approved">✅ Approved</span>',inpay:'<span class="chip c-inpay">💸 Waiting payout</span>',paid:'<span class="chip c-paid">💰 Paid</span>',void:'<span class="chip c-void">✖ Cancelled</span>'}[s]||'');
function chart(L){const mx=Math.max(1,...L.map(x=>x.c));return`<div class="chart">${L.map(x=>`<i class="${x.c?'':'z'}" title="${x.d}: ${rp(x.c)} · ${x.o} order(s) · ${x.k} view(s)" style="height:${x.c?Math.max(6,Math.round(x.c/mx*90)):2}px"></i>`).join('')}</div>`}
function srcCard(S){const L=Object.entries(S||{}).sort((a,b)=>b[1].v-a[1].v),tv=L.reduce((t,x)=>t+x[1].v,0)||1;return`<div class="card"><b>🔗 Where your visitors come from</b><div class="mut">The places your link was opened from, in the period chosen above.</div>${L.length?`<table><tr><th>Source</th><th class="r2">Views</th><th class="r2">Orders</th><th class="r2">Sales</th></tr>${L.map(([k,v])=>`<tr><td>${esc(SRC[k]||k)}</td><td class="r2">${v.v} <span class="mut">${Math.round(v.v/tv*100)}%</span></td><td class="r2">${v.o}</td><td class="r2">${rp(v.s)}</td></tr>`).join('')}</table>`:'<p class="mut">No link views in this period yet.</p>'}</div>`}
function howCard(full){const c=D.cfg,m=D.me;return`<div class="card how"><b>💡 How you earn</b><ul><li>You earn <b>${m.rate}%</b> of what your customer paid <b>for the products</b>, after any discount. <b>Delivery fee, packaging, service charge and tax are not included.</b></li><li>Example: the customer pays Rp 100.000 for products, gets a Rp 10.000 discount, and pays Rp 15.000 delivery and tax. Your commission is ${m.rate}% of Rp 90.000 = ${rp(90000*m.rate/100)}.</li><li><b>Under review</b> → the order is placed. <b>Approved</b> → ${c.hold} days after the order is delivered, with no complaint. <b>Paid</b> → we transfer it to you.</li><li><b>Cancelled</b> orders, <b>refunds</b> and orders with a <b>complaint</b> earn no commission.</li><li>Request a payout when you have at least <b>${rp(c.min)}</b> approved. <b>We pay every ${esc(c.pay.name)}.</b> Your payout details must be confirmed by the shop first.</li>${full?`<li>Orders count when the customer opens your link (we remember it for ${c.days} days) or uses your code. You cannot earn from your own orders.</li>`:''}</ul></div>`}
/* sharing: a ready message with the code and link; every network gets it in its own way */
const shareMsg=()=>{const m=D.me,d=m.sac&&m.sac.disc||m.disc,nm=(I&&I.look&&I.look.name)||'Sarang Butter';return(d>0?`Get ${d}% off at ${nm} with my code ${m.code}! 🧈`:`Order at ${nm} and use my code ${m.code}! 🧈`)+' '+link()};
function shareTo(k){const t=shareMsg(),u=link(),e=encodeURIComponent,go=h=>window.open(h,'_blank','noopener');
if(k=='wa')return go('https://wa.me/?text='+e(t));if(k=='th')return go('https://www.threads.net/intent/post?text='+e(t));if(k=='x')return go('https://x.com/intent/post?text='+e(t.replace(' '+u,''))+'&url='+e(u));if(k=='fb')return go('https://www.facebook.com/sharer/sharer.php?u='+e(u)+'&quote='+e(t.replace(' '+u,'')));if(k=='tg')return go('https://t.me/share/url?url='+e(u)+'&text='+e(t.replace(' '+u,'')));
if(k=='native'){navigator.share({title:'My code '+D.me.code,text:t.replace(' '+u,''),url:u}).catch(()=>{});return}
if(k=='ig'){cp(t);setTimeout(()=>{MSG='✓Message copied. Paste it in your Instagram story, post, bio or DM.';dash();go('https://www.instagram.com/')},50)}}
async function cp(t){try{await navigator.clipboard.writeText(t);MSG='✓Copied!'}catch(e){prompt('Copy this:',t);return}dash();setTimeout(()=>{MSG='';},1500)}
const qrLoad=async()=>{if(!window.qrcode)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='/vendor/qrcode.js';s.onload=ok;s.onerror=no;document.head.append(s)})};
async function qr(){const e=$('#qr');e.classList.toggle('hide');if(e.innerHTML)return;try{await qrLoad();const q=window.qrcode(0,'M');q.addData(link());q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;e.innerHTML=`<svg viewBox="-2 -2 ${n+4} ${n+4}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}"/></svg><div><button class="s" onclick="qrSave()">💾 Save coupon image</button></div><div id="qri"></div>`}catch(x){e.textContent='QR code could not load.'}}
/* a coupon picture (brand, code, discount, QR code, link) that can be saved to the phone or shared */
async function qrCanvas(){await qrLoad();const m=D.me,dsc=m.sac&&m.sac.disc||m.disc,q=window.qrcode(0,'M');q.addData(link());q.make();const n=q.getModuleCount(),W=900,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),ac=getComputedStyle(document.documentElement).getPropertyValue('--pc').trim()||'#b73700',nm=(I&&I.look&&I.look.name)||'Sarang Butter';
g.fillStyle='#fff7ec';g.fillRect(0,0,W,H);g.fillStyle=ac;g.fillRect(0,0,W,170);g.fillStyle='#fff';g.textAlign='center';g.font='800 64px system-ui,sans-serif';g.fillText(nm.slice(0,24),W/2,108);
g.fillStyle='#2b0d09';g.font='700 40px system-ui,sans-serif';g.fillText('Scan to shop',W/2,250);
const box=560,x0=(W-box)/2,y0=285;g.fillStyle='#fff';g.beginPath();g.roundRect?g.roundRect(x0-30,y0-30,box+60,box+60,36):g.rect(x0-30,y0-30,box+60,box+60);g.fill();const cs=box/(n+0);g.fillStyle='#111';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(Math.round(x0+k*cs),Math.round(y0+r*cs),Math.ceil(cs),Math.ceil(cs));
g.fillStyle='#2b0d09';g.font='600 40px system-ui,sans-serif';g.fillText(dsc>0?'Get '+dsc+'% off with code':'Use my code',W/2,y0+box+110);
g.fillStyle=ac;g.font='800 120px system-ui,sans-serif';g.fillText(m.code,W/2,y0+box+240);g.fillStyle='#6b4a3a';g.font='500 30px system-ui,sans-serif';g.fillText(link().replace(/^https?:\/\//,''),W/2,H-60);return c}
async function qrSave(){const e=$('#qri');try{const c=await qrCanvas(),blob=await new Promise(ok=>c.toBlob(ok,'image/png')),name='coupon-'+D.me.code+'.png',f=new File([blob],name,{type:'image/png'});e.innerHTML=`<img class="qrimg" src="${c.toDataURL('image/png')}" alt="Coupon ${esc(D.me.code)}"><small class="mut" style="display:block;margin-top:4px">Saved as ${esc(name)}. If nothing downloads, press and hold the picture and choose Save image.</small>`;
if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({files:[f],title:'My coupon '+D.me.code});return}catch(x){if(x&&x.name=='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}catch(x){if(e)e.textContent='Could not make the picture.'}}
async function askPayout(){if(!confirm('Request a payout of '+rp(D.money.ready)+'? We will transfer it to your confirmed account on payout day ('+D.cfg.pay.name+').'))return;try{await api('payout');MSG='✓Payout requested. We pay every '+D.cfg.pay.name+'.';TAB='po';await reload()}catch(e){MSG='!'+e.message;dash()}}
async function saveProfile(){try{await api('profile',{name:$('#pn').value,wa:$('#pw').value});MSG='✓Saved.';await reload()}catch(e){MSG='!'+e.message;dash()}}
async function savePay(){const acc=$('#pa').value;try{if(!acc&&D.me.pay&&D.me.pay.acc)throw new Error('Enter the account number again to save changes.');await api('profile',{pay:{t:$('#pt').value,bank:$('#pb').value,acc,nm:$('#pm').value}});MSG='✓Saved. The shop will confirm your details before your first payout.';await reload()}catch(e){MSG='!'+e.message;dash()}}
async function savePw(){try{await api('pw',{p0:$('#p0').value,p1:$('#p1').value});MSG='✓Password changed.';await reload()}catch(e){MSG='!'+e.message;dash()}}
boot();
</script></body></html>
