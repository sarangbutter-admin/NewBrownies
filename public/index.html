<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fd:'Bagel Fat One',Impact,'Arial Black',sans-serif;--red:#4d2100;--red2:#361700;--cream:#f6eedc;--ink:#2b0d09;--mus:#f2b632;--bg:#4d2100;--card:#fffaf0;--ct:#2b0d09;--pc:#4d2100;--bc:#2b0d09}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--lat,none) var(--bg);color:var(--cream);font:400 15px/1.4 var(--fb),system-ui,sans-serif}
.app{max-width:480px;margin:auto;padding-bottom:110px;overflow-x:hidden}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--red2);border-bottom:4px dashed var(--mus);max-width:480px;margin:auto}
.logo{font:400 24px/1 var(--fd);color:var(--cream)}.logo small{display:block;font:600 9px var(--fb);letter-spacing:.2em;color:var(--mus)}
.cb{position:relative;background:var(--cream);color:var(--ink);border:0;border-radius:99px;padding:9px 14px;font:700 14px var(--fb);box-shadow:3px 3px 0 var(--ink)}
.bd{position:absolute;top:-9px;right:-6px;background:var(--mus);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3) rotate(-8deg)}}
.hero{position:relative;text-align:center;padding:30px 16px 0}
.hero h1{font:400 clamp(44px,15vw,70px)/.92 var(--fd);margin:4px 0 8px;text-shadow:3px 3px 0 var(--ink);animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.hero .s{font:400 22px var(--fd);letter-spacing:.04em}
.arc{position:absolute;top:20px;width:90px;height:45px;border-radius:90px 90px 0 0;background:repeating-radial-gradient(circle at 50% 100%,transparent 0 7px,var(--cream) 7px 13px);animation:sw 4s ease-in-out infinite}
.arc.l{left:-12px}.arc.r{right:-12px;animation-delay:-2s}@keyframes sw{50%{transform:translateY(8px)}}
.chk{height:36px;margin-top:24px;position:relative;overflow:hidden}.chk:before{content:'';position:absolute;top:0;bottom:0;left:-72px;right:0;background:conic-gradient(var(--cream) 25%,transparent 0 50%,var(--cream) 0 75%,transparent 0) 0 0/36px 36px;animation:sl 3s linear infinite;will-change:transform}
@keyframes sl{to{transform:translateX(72px)}}
.tk{background:var(--mus);color:var(--ink);overflow:hidden;white-space:nowrap;font:700 12px var(--fb);padding:6px 0;margin-bottom:8px}
.tk span{display:inline-block;padding-left:100%;animation:mq 18s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}
h2.rv{font:400 28px var(--fd);margin:24px 16px 14px;text-shadow:2px 2px 0 var(--ink)}h2 i{color:var(--mus);font-style:normal;display:inline-block;animation:sp 6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.rv{opacity:0;transform:translateY(34px) rotate(-1.5deg);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1.3)}.rv.shown{opacity:1;transform:none}
.cd{display:flex;gap:12px;align-items:center;background:var(--card);color:var(--ct);border-radius:22px;padding:10px;margin:0 16px 16px;box-shadow:5px 5px 0 var(--ink);cursor:pointer}
.cd:active{transform:translate(3px,3px) scale(.98);box-shadow:2px 2px 0 var(--ink)}
.cd h3{margin:0;font:400 19px/1.1 var(--fd)}.cd p{margin:3px 0 6px;font-size:12px;opacity:.75;line-height:1.35}.pr{color:var(--pc)}
.tile{width:92px;height:92px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:48px;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#fff3 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,#fff3 0 2px,transparent 2px 12px)}
.tile span{position:relative;z-index:1;animation:fl 3s ease-in-out infinite;filter:drop-shadow(2px 4px 0 #0004)}@keyframes fl{50%{transform:translateY(-6px) rotate(7deg)}}
.pl{width:38px;height:38px;border-radius:50%;border:0;background:var(--red);color:var(--cream);font:700 22px var(--fb);box-shadow:2px 2px 0 var(--ink)}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.pn{background:var(--card);color:var(--ct);width:100%;max-width:480px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:28px 28px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .45s cubic-bezier(.2,1,.3,1)}@keyframes up{from{transform:translateY(100%)}}
.pn h2{font:400 28px/1 var(--fd);margin:14px 0 4px}.pn p{margin:0 0 10px;opacity:.8}
.tp{display:flex;justify-content:space-between;padding:10px 12px;border:2px solid var(--bc);border-radius:14px;margin:7px 0;cursor:pointer;transition:.2s}.tp.on{background:var(--mus);color:var(--ink);border-color:var(--ink);transform:scale(1.02) rotate(-.6deg)}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.q{display:flex;align-items:center;gap:10px;font-weight:700}.q button{width:36px;height:36px;border-radius:50%;border:2px solid var(--bc);background:transparent;color:inherit;font:700 20px var(--fb)}.q b{min-width:20px;text-align:center;display:inline-block}
.q b.pp{animation:bump .3s}
.bt{width:100%;border:0;border-radius:16px;padding:15px;background:var(--red);color:var(--cream);font:400 20px var(--fd);box-shadow:4px 4px 0 var(--ink);letter-spacing:.03em}.bt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.bt.g{background:transparent;color:inherit;box-shadow:none;border:2px dashed currentColor;margin-top:10px;font-size:16px}
.bar{position:fixed;left:12px;right:12px;margin:auto;max-width:456px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;transform:translateY(160%);transition:transform .5s cubic-bezier(.2,1.3,.4,1);display:flex;justify-content:space-between;align-items:center;background:var(--mus);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:13px 16px;font-weight:700;box-shadow:4px 4px 0 var(--ink)}.bar.on{transform:none}
.pg{position:fixed;inset:0;z-index:30;background:var(--lat,none) var(--bg);overflow:auto;display:none}.pg.on{display:block;animation:rt .4s cubic-bezier(.2,1,.3,1)}@keyframes rt{from{transform:translateX(100%)}}
.in{max-width:480px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px))}
.in h1{font:400 38px/1 var(--fd);margin:8px 0 14px;text-shadow:3px 3px 0 var(--ink)}
.bk{background:none;border:0;color:var(--cream);font:700 14px var(--fb);padding:6px 0}
.ln{display:flex;gap:10px;align-items:center;background:var(--card);color:var(--ct);border-radius:18px;padding:10px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink);animation:pop .4s}
.ln .tile{width:56px;height:56px;font-size:30px;border-radius:14px}.ln small{opacity:.7;display:block;font-size:11px}
.bx{background:var(--card);color:var(--ct);border-radius:18px;padding:14px;margin:14px 0;box-shadow:4px 4px 0 var(--ink)}.bx .row{margin:6px 0}

async function pickCmp(inp){const fl=[...inp.files].slice(0,3-CPI.length);if(inp.files.length>fl.length)alert('You can add up to 3 photos.');for(const f of fl){if(!/^image\//.test(f.type))continue;try{CPI.push(await imgData(f,900))}catch(e){alert('Could not read '+f.name)}}$('#cpv').innerHTML=cpv();inp.value=''}
const cmpBox=o=>{if(stg(o.no)!=4)return'';const c=cmpOf(o);if(c)return`<div class="bx"><b>⚠ Your complaint: ${CL[c.status]||esc(c.status)}</b><br><small>${esc(c.reason)} · ${new Date(c.at).toLocaleString()}</small>${c.status=='open'?'<div style="margin-top:6px">We will contact you by WhatsApp or email. Please keep your <b>uncut unboxing video</b> ready.</div>':''}${c.note?'<div style="margin-top:6px">'+(c.status=='resolved'?'<b>Resolution:</b> ':'')+esc(c.note)+'</div>':''}${c.status=='resolved'&&c.rpi?`<img src="/_blob/${esc(c.rpi)}" alt="Resolution proof" style="max-width:100%;border-radius:12px;margin-top:8px"><small style="display:block">Proof from the shop</small>`:''}</div>`;
const end=((ST[o.no]||{}).t||o.at)+CWMS();if(now()>end)return'<div class="bx"><small>The complaint period for this order has ended.</small></div>';
return`<details class="bx"><summary><b>⚠ Something wrong? Report a problem</b><br><small>You can report within <span data-x="${end}"></span></small></summary><div style="margin-top:10px"><select class="f" id="cr">${['Damaged item','Wrong item','Missing item','Quality problem','Other'].map(x=>`<option>${x}</option>`).join('')}</select><select class="f" id="ci">${(o.items||[]).map(i=>`<option>${esc(i.n)}</option>`).join('')}<option>Whole order</option></select><textarea class="f" id="ct2" rows="3" maxlength="400" placeholder="What went wrong?"></textarea><b>Photos of the product *</b> <small>(up to 3)</small><input type="file" accept="image/*" multiple onchange="pickCmp(this)" style="margin-top:6px"><div id="cpv">${cpv()}</div>
<div class="nudge" style="margin-top:10px">🎥 Please prepare your <b>uncut unboxing video</b> (from the sealed package to opening). We will contact you by WhatsApp or email to collect it.</div><label class="tp"><span>I will keep my uncut unboxing video ready</span><input type="checkbox" id="cv2"></label><div id="cer2" style="color:#d2262b;font-weight:700;margin:6px 0"></div><button class="bt" data-n="${esc(o.no)}" onclick="submitCmp(this.dataset.n)">SEND COMPLAINT</button></div></details>`};
async function submitCmp(no){const o=MY.find(x=>x.no==no);if(!o)return;const er=m=>$('#cer2').textContent=m,tx=$('#ct2').value.trim();if(!CPI.length)return er('Please add at least one photo of the product.');if(tx.length<5)return er('Please describe the problem.');if(!$('#cv2').checked)return er('Please confirm that you will keep your uncut unboxing video ready.');
try{await API('complaint',{no,reason:$('#cr').value,item:$('#ci').value,text:tx,imgs:CPI});CPI=[];await window.refetchAll()}catch(e){er(e.message||'Could not send. Please try again.')}}

const vCmp=()=>{if(!can('cm'))return'<small>No access.</small>';const ct={all:CMP.length};CMP.forEach(c=>ct[c.status]=(ct[c.status]||0)+1);const L=CF=='rf'?[]:CMP.filter(c=>CF=='all'||c.status==CF);
return`<div class="bx wd"><div class="md sm">${[['all','All'],['open','Open'],['contacted','Contacted'],['resolved','Resolved'],['rf','💸 Refunded']].map(a=>`<button class="${CF==a[0]?'on':''}" onclick="CF='${a[0]}';bko(1)">${a[1]} <span class="cnt">${a[0]=='rf'?RFO().length:ct[a[0]]||0}</span></button>`).join('')}</div><small style="display:block;margin-top:8px">Customers were asked to prepare an uncut unboxing video. Contact them by WhatsApp or email to collect it.</small></div>`+(CF=='rf'?(RFO().map(rfCard).join('')||'<div class="wd"><div class="empty" style="font-size:18px">No refunded orders</div></div>'):L.map(cCard).join('')||'<div class="wd"><div class="empty" style="font-size:18px">No complaints</div></div>')};
const RFO=()=>ALL.filter(o=>stg(o.no)==-2).sort((a,b)=>((ST[b.no]||{}).t||0)-((ST[a.no]||{}).t||0)),rfCard=o=>{const st=ST[o.no]||{};return`<div class="bx" style="margin:0"><div class="row" style="margin:0"><b>#${esc(o.no)} · ${esc(o.name)}</b><span class="chip">💸 Refunded</span></div><small>${fmt(+o.total||0)} · ${esc(o.method||'')} · refunded ${st.t?new Date(st.t).toLocaleString():''}${st.by?' · '+esc(st.by):''}<br>📱 ${esc(o.phone||'')} · ✉️ ${esc(o.email||'no email')}</small>${st.note?`<div style="margin:6px 0">${esc(st.note)}</div>`:''}<div style="margin:4px 0"><small>${itx(o)}</small></div>${st.rfi?`<div class="md sm"><button onclick="viewRf('${esc(st.rfi)}')">🧾 Refund proof</button></div>`:''}</div>`};
const cCard=c=>{const msg=`Hi ${c.name}! This is Folklore Brownies about your complaint for order #${c.no} (${c.reason}). We are sorry about this. Please send us your UNCUT unboxing video (from the sealed package to opening) so we can resolve it quickly. Thank you!`;
return`<div class="bx" style="margin:0"><div class="row" style="margin:0"><b>#${esc(c.no)} · ${esc(c.name)}</b><span class="chip">${CL[c.status]||esc(c.status)}</span></div><small>${esc(c.reason)} · ${esc(c.item||'')} · ${new Date(c.at).toLocaleString()}<br>📱 ${esc(c.phone||'')} · ✉️ ${esc(c.email||'no email')}</small><div style="margin:6px 0">${esc(c.text)}</div>${c.note?`<small>${c.status=='resolved'?'Resolution':'Note'}: ${esc(c.note)}${c.by?' · '+esc(c.by):''}</small>`:''}<div class="md sm"><button data-i="${esc(c.id)}" onclick="viewCmpImgs(this.dataset.i)">🖼 Photos (${+c.nimg||0})</button>${c.rpi?`<button onclick="viewRf('${esc(c.rpi)}')">✅ Resolution proof</button>`:''}</div><div style="margin-top:4px">${nl({phone:c.phone,email:c.email,no:c.no},msg)}</div><div class="md sm" style="margin-top:8px">${['open','contacted','resolved'].map(s=>`<button class="${c.status==s?'on':''}" data-i="${esc(c.id)}" onclick="setCm(this.dataset.i,'${s}')">${CL[s]}</button>`).join('')}</div></div>`};
async function viewCmpImgs(id){const c=CMP.find(x=>x.id==id);if(!c)return;try{const a=await Promise.all(Array.from({length:+c.nimg||0},(_,i)=>DB.doc('cmpimgs/'+id+'_'+i).get()));modal(`<b>Complaint photos · #${esc(c.no)}</b>`+a.map(s=>s.exists&&okImg(s.data().img)?`<img src="${s.data().img}" alt="" style="max-width:100%;border-radius:12px;margin:10px 0">`:'').join(''))}catch(e){alert('Could not load the photos.')}}
function setCm(id,s){const c=CMP.find(x=>x.id==id);if(!c||c.status==s)return;if(s!='resolved')return doCm(id,s,c.note||'');
ask('Resolve complaint #'+c.no+'? Write the reason and upload a proof picture (e.g. replacement sent, refund receipt). The customer sees both.',async()=>{const f=($('#rpf')||{}).files,nt=(($('#cn2')||{}).value||'').trim();if(nt.length<3){alert('Please write the reason / resolution.');return setCm(id,s)}if(!f||!f[0]){alert('Please choose the proof picture.');return setCm(id,s)}
let rid='';try{const A=await claude.use('assets');rid=(await A.upload(await shrink(f[0],1200))).id}catch(e){alert('Could not upload the proof picture.');return setCm(id,s)}doCm(id,s,nt,rid)},
'<input class="f" id="cn2" maxlength="160" placeholder="Reason / what was done (required)"><label class="bt g" style="display:block;margin:4px 0 10px;cursor:pointer">📎 Choose proof picture (required)<input id="rpf" type="file" accept="image/*" style="display:none" onchange="this.parentNode.firstChild.textContent=\'✅ \'+(this.files[0]?this.files[0].name:\'\')"></label>','RESOLVE COMPLAINT')}
async function doCm(id,s,note,rpi){const c=CMP.find(x=>x.id==id);if(!c)return;try{await DB.doc('complaints/'+id).update({status:s,note,...(rpi?{rpi}:{}),by:SESS.u,upAt:now()});LOG('cmp.upd','Complaint #'+c.no+' · '+c.name,CL[c.status]+' → '+CL[s]+(note?' · '+note:'')+(rpi?' · proof added':''));

+(L.map(o=>{const t=stg(o.no);return`<div class="bx" style="margin:0"><div class="row" style="margin:0"><b>#${esc(o.no)}</b><b>${fmt(+o.total||0)}</b></div><small>${new Date(o.at).toLocaleString()} · <b>${stL(o,t)}</b>${o.coupon?' · 🎟 '+esc(o.coupon):''}${o.tier=='b2b'?' · 🏢 B2B':''}<br>${itx(o)}</small></div>`}).join('')||'<div class="wd"><div class="empty" style="font-size:18px">No orders from this customer yet</div></div>')};
