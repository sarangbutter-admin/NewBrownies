[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/catalog.json", "public/index.html", "netlify.toml"]

# ---- security headers for every page ----
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://challenges.cloudflare.com https://www.facebook.com https://connect.facebook.net https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.doubleclick.net https://www.google.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"

# the public shop addresses never serve the owner site; the admin address opens the owner site straight away
[[redirects]]
  from = "https://sarangbutter.com/admin"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://sarangbutter.com/admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.sarangbutter.com/admin"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.sarangbutter.com/admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://sarangorder.netlify.app/admin"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://sarangorder.netlify.app/admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://main--sarangorder.netlify.app/admin"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://main--sarangorder.netlify.app/admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://admin.sarangbutter.com/"
  to = "/admin"
  status = 302
  force = true

# the staff back office has its own address: /admin (the shop page has no link or trick that leads there)
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200
  force = true

[[redirects]]
  from = "/affiliate"
  to = "/affiliate.html"
  status = 200
  force = true

[[headers]]
  for = "/affiliate*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# libraries never change: let browsers and the CDN keep them for a month
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# never let browsers or CDNs cache private API answers
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
